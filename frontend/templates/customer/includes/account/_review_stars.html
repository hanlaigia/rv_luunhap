{% macro review_stars(rating, size='') %}
<div class="review-card__stars{% if size == 'sm' %} review-card__stars--sm{% endif %}" aria-label="{{ rating }} trên 5 sao">
  {% for i in range(1, 6) %}
  <i class="bi bi-star-fill{% if i > rating %} review-card__star--empty{% endif %}"></i>
  {% endfor %}
</div>
{% endmacro %}
